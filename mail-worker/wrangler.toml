name = "mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true
workers_dev = false

[observability]
enabled = true

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["21 * * * *"]

[vars]
domain = ["fatihertem.com"]
#admin = ""
# JWT secret is a Worker secret, not a [vars] value:
# pnpm wrangler secret put jwt_secret
# Required only to initialize a new D1 database. Generate an independent, random value:
# pnpm wrangler secret put BOOTSTRAP_TOKEN
# Turnstile verification is server-side only. Configure this in Workers secrets:
# pnpm wrangler secret put TURNSTILE_SECRET_KEY
TURNSTILE_HOSTNAME = "mail.fatihertem.com"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
